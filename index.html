<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NITRO HORIZON</title>
  <meta name="description" content="Corrida arcade pseudo-3D em pixel art: 15 carros, 4 modelos, 3 pistas e HUD retrô." />
  <meta name="theme-color" content="#0b0d17" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230b0d17'/><rect x='2' y='6' width='12' height='6' fill='%2322e0ff'/><rect x='4' y='3' width='8' height='4' fill='%23ff3d7f'/></svg>" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #05060c;
      overflow: hidden;
      font-family: ui-monospace, monospace;
    }
    #app {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 40%, #141a33 0%, #05060c 70%);
    }
    #game {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
      background: #000;
      box-shadow: 0 0 0 2px #1c2340, 0 0 60px rgba(34, 224, 255, 0.18);
      touch-action: none;
    }
    #hint {
      position: fixed;
      left: 0; right: 0; bottom: 8px;
      text-align: center;
      color: #4a5480;
      font-size: 11px;
      letter-spacing: 1px;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="game" width="320" height="224" aria-label="Nitro Horizon"></canvas>
  </div>
  <div id="hint">SETAS / WASD · ESPAÇO = NITRO · SHIFT/CTRL = MARCHA · ENTER = CONFIRMAR</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
